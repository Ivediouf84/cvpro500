<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - NovaDoc</title>
    <link rel="stylesheet" href="styles.css?v=20260801_v52">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const saved = localStorage.getItem('novadoc_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.auth-body {
            background: var(--body-bg);
            min-height: 100vh;
            margin: 0;
            padding: 3rem 1rem;
            color: var(--text-main);
            display: block;
            text-align: center;
        }
        .cvpro-login-card {
            background: var(--surface);
            padding: 2.2rem 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 460px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        .cvpro-login-card * {
            box-sizing: border-box;
        }
        
        /* Auth Tabs */
        .auth-tabs-nav {
            display: flex;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 1.5rem;
            gap: 4px;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .auth-tab-btn.active {
            background: var(--grad-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .cvpro-login-card h2 {
            margin-top: 0;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
            color: var(--text-main);
            display: block;
        }
        .cvpro-login-card p.subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
            display: block;
        }
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
            display: block;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            bottom: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .password-toggle:hover {
            color: var(--text-main);
        }
        .btn-auth {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: var(--transition);
        }
        .btn-auth:hover {
            box-shadow: var(--shadow-glow);
        }
        .toggle-text {
            display: block;
            margin-top: 1.4rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .toggle-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            display: none;
            text-align: left;
            line-height: 1.5;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
    </style>
</head>
<body class="auth-body">

    <div class="cvpro-login-card">
        <a href="index.html" style="display: inline-block; margin-bottom: 1rem;">
            <img src="novadoc-logo-n.png?v=12" alt="NovaDoc Logo" style="height: 48px; width: auto; object-fit: contain;">
        </a>

        <!-- Tabs Navigation -->
        <div class="auth-tabs-nav" id="auth-tabs-nav">
            <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="setAuthMode('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Connexion
            </button>
            <button type="button" class="auth-tab-btn" id="tab-signup-btn" onclick="setAuthMode('signup')">
                <i class="fa-solid fa-user-plus"></i> Inscription
            </button>
        </div>

        <h2 id="auth-title">Connexion</h2>
        <p class="subtitle" id="auth-subtitle">Accédez à votre espace NovaDoc</p>

        <div id="auth-alert" class="alert"></div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <!-- Signup Name Fields -->
            <div id="signup-fields" style="display: none;">
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1.1rem;">
                    <div style="flex: 1;" class="form-group">
                        <label for="prenom">Prénom *</label>
                        <input type="text" id="prenom" class="form-control" placeholder="Ex: Moussa">
                    </div>
                    <div style="flex: 1;" class="form-group">
                        <label for="nom">Nom *</label>
                        <input type="text" id="nom" class="form-control" placeholder="Ex: DIOP">
                    </div>
                </div>
            </div>

            <div class="form-group" id="group-email">
                <label for="email">Adresse E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required>
            </div>

            <div class="form-group" id="group-password">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label for="password" style="margin-bottom: 0;" id="label-password">Mot de passe</label>
                    <a href="#" id="link-forgot" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Oublié ?</a>
                </div>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                <i class="fa-solid fa-eye password-toggle" id="toggle-password"></i>
            </div>

            <button type="submit" class="btn-auth" id="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </button>
        </form>

        <div class="toggle-text" id="toggle-container">
            Pas encore de compte ? <a href="#" id="link-toggle">S'inscrire</a>
        </div>
        
        <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahubfrxlycfkgriizmde.supabase.co';
        const SUPABASE_KEY = localStorage.getItem('supabase_anon_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodWJmcnhseWNma2dyaWl6bWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA5NTIsImV4cCI6MjA5OTcyNjk1Mn0.dCzbPw4wWgnYRU4XCH2B2WOgm1O3KaH6s2UCbsQ73bY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'login'; // 'login', 'signup', 'forgot', 'reset'

        // Rate limiting anti-brute force: 5 attempts per 60s -> 15 min lock
        function checkRateLimit() {
            const lockoutUntil = Number(localStorage.getItem('novadoc_lockout_until') || 0);
            if (lockoutUntil && Date.now() < lockoutUntil) {
                const remainingMins = Math.ceil((lockoutUntil - Date.now()) / 60000);
                showAlert(`<strong>🔒 Accès temporairement verrouillé.</strong><br>Vous avez dépassé le nombre de tentatives de connexion autorisées (5 tentatives en 1 minute).<br><br>👉 Veuillez attendre <strong>${remainingMins} minute(s)</strong> avant de réessayer.`, true);
                return false;
            }
            return true;
        }

        function recordFailedAttempt() {
            const now = Date.now();
            let attempts = JSON.parse(localStorage.getItem('novadoc_failed_attempts') || '[]');
            attempts = attempts.filter(ts => (now - ts) < 60000); // 1 minute window
            attempts.push(now);
            localStorage.setItem('novadoc_failed_attempts', JSON.stringify(attempts));

            if (attempts.length >= 5) {
                const lockoutUntil = now + (15 * 60 * 1000); // 15 minutes lock
                localStorage.setItem('novadoc_lockout_until', lockoutUntil.toString());
                showAlert(`<strong>🔒 Trop de tentatives (5/5).</strong><br>Par mesure de sécurité, la connexion est bloquée pendant <strong>15 minutes</strong>.`, true);
                return true;
            }
            return false;
        }

        function resetRateLimit() {
            localStorage.removeItem('novadoc_failed_attempts');
            localStorage.removeItem('novadoc_lockout_until');
        }

        function setAuthMode(mode) {
            currentMode = mode;
            hideAlert();

            const titleEl = document.getElementById('auth-title');
            const subtitleEl = document.getElementById('auth-subtitle');
            const btnEl = document.getElementById('btn-submit');
            const toggleContainerEl = document.getElementById('toggle-container');
            const signupFields = document.getElementById('signup-fields');
            const emailGroup = document.getElementById('group-email');
            const passwordGroup = document.getElementById('group-password');
            const linkForgot = document.getElementById('link-forgot');
            const passwordLabel = document.getElementById('label-password');
            const tabsNav = document.getElementById('auth-tabs-nav');
            const tabLoginBtn = document.getElementById('tab-login-btn');
            const tabSignupBtn = document.getElementById('tab-signup-btn');

            const prenomInput = document.getElementById('prenom');
            const nomInput = document.getElementById('nom');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            if (currentMode === 'signup') {
                tabsNav.style.display = 'flex';
                tabSignupBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');

                titleEl.innerText = "Créer un compte";
                subtitleEl.innerText = "Rejoignez NovaDoc en quelques secondes";
                btnEl.innerHTML = '<i class="fa-solid fa-user-plus"></i> S\'inscrire';
                toggleContainerEl.innerHTML = 'Déjà un compte ? <a href="#" id="link-toggle">Se connecter</a>';
                
                signupFields.style.display = 'block';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'none';
                passwordLabel.innerText = "Mot de passe";
                
                prenomInput.required = true;
                nomInput.required = true;
                emailInput.required = true;
                passwordInput.required = true;
            } else if (currentMode === 'forgot') {
                tabsNav.style.display = 'none';

                titleEl.innerText = "Mot de passe oublié";
                subtitleEl.innerText = "Saisissez votre adresse e-mail pour recevoir les instructions";
                btnEl.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoyer le lien';
                toggleContainerEl.innerHTML = 'Retour à la <a href="#" id="link-toggle">Connexion</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = true;
                passwordInput.required = false;
            } else if (currentMode === 'reset') {
                tabsNav.style.display = 'none';

                titleEl.innerText = "Nouveau mot de passe";
                subtitleEl.innerText = "Saisissez votre nouveau mot de passe ci-dessous";
                btnEl.innerHTML = '<i class="fa-solid fa-key"></i> Enregistrer le mot de passe';
                toggleContainerEl.innerHTML = '<a href="#" id="link-toggle">Retour à la connexion</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'none';
                passwordLabel.innerText = "Nouveau mot de passe";
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = false;
                passwordInput.required = true;
            } else {
                // Login mode
                tabsNav.style.display = 'flex';
                tabLoginBtn.classList.add('active');
                tabSignupBtn.classList.remove('active');

                titleEl.innerText = "Connexion";
                subtitleEl.innerText = "Accédez à votre espace NovaDoc";
                btnEl.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
                toggleContainerEl.innerHTML = 'Pas encore de compte ? <a href="#" id="link-toggle">S\'inscrire</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'inline';
                passwordLabel.innerText = "Mot de passe";
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = true;
                passwordInput.required = true;
            }

            // Attach event listener to dynamic link
            const toggleLink = document.getElementById('link-toggle');
            if (toggleLink) {
                toggleLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (currentMode === 'signup' || currentMode === 'forgot' || currentMode === 'reset') {
                        setAuthMode('login');
                    } else {
                        setAuthMode('signup');
                    }
                });
            }
        }

        function showAlert(msg, isError = true) {
            const alertEl = document.getElementById('auth-alert');
            alertEl.style.display = 'block';
            alertEl.innerHTML = msg;
            alertEl.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
            
            const alertForgotLink = document.getElementById('alert-link-forgot');
            if (alertForgotLink) {
                alertForgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    setAuthMode('forgot');
                });
            }
        }

        function hideAlert() {
            document.getElementById('auth-alert').style.display = 'none';
        }

        async function handleAuth(e) {
            e.preventDefault();
            hideAlert();

            if (currentMode === 'login' && !checkRateLimit()) {
                return;
            }

            const btn = document.getElementById('btn-submit');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Traitement...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || "index.html";

            try {
                if (currentMode === 'signup') {
                    const prenom = document.getElementById('prenom').value.trim();
                    const nom = document.getElementById('nom').value.trim();

                    const redirectUrl = window.location.origin + window.location.pathname + `?redirect=${encodeURIComponent(redirectTarget)}`;

                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                first_name: prenom,
                                last_name: nom
                            },
                            emailRedirectTo: redirectUrl
                        }
                    });
                    if (error) throw error;
                    
                    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                        showAlert(`<strong>❌ E-mail déjà utilisé !</strong><br>Un compte NovaDoc existe déjà avec l'adresse <strong>${email}</strong>.<br><br>👉 Veuillez vous connecter avec cet e-mail ou cliquer sur <strong>Mot de passe oublié</strong>.`, true);
                        return;
                    }

                    if (data.session) {
                        resetRateLimit();
                        window.location.href = redirectTarget;
                    } else {
                        document.getElementById('auth-form').reset();
                        showAlert(`<strong>Inscription réussie ! ✉️</strong><br>Un e-mail de validation a été envoyé à <strong>${email}</strong>.<br><br>💡 <strong>REMARQUE :</strong> Vérifiez vos <strong>Spams / Courriers indésirables</strong> puis cliquez sur le lien.<br><br><button type="button" onclick="resendConfirmation('${email}')" style="background:#4F46E5; color:white; border:none; padding:0.5rem 1rem; border-radius:6px; font-size:0.85rem; font-weight:bold; cursor:pointer; margin-top:0.4rem;"><i class="fa-solid fa-paper-plane"></i> Renvoyer l'e-mail de confirmation</button>`, false);
                        setAuthMode('login');
                    }
                } else if (currentMode === 'forgot') {
                    const resetRedirectUrl = window.location.origin + window.location.pathname + '?mode=reset';
                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: resetRedirectUrl
                    });
                    if (error) throw error;
                    showAlert(`<strong>Lien envoyé ! ✉️</strong><br>Un e-mail contenant les instructions a été envoyé à <strong>${email}</strong>.<br><br>Veuillez consulter votre boîte de réception (et vos spams) puis cliquer sur le lien.`, false);
                } else if (currentMode === 'reset') {
                    const { error } = await supabase.auth.updateUser({ password: password });
                    if (error) throw error;
                    resetRateLimit();
                    showAlert("<strong>Mot de passe mis à jour ! 🔑</strong><br>Votre mot de passe a été modifié avec succès. Redirection...", false);
                    setTimeout(() => {
                        window.location.href = redirectTarget;
                    }, 1200);
                } else {
                    // Login mode
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    if (error) {
                        recordFailedAttempt();
                        throw error;
                    }
                    
                    resetRateLimit();
                    window.location.href = redirectTarget;
                }
            } catch (err) {
                console.error("Auth error:", err);
                let msg = err.message || "Une erreur est survenue lors de l'authentification.";
                if (msg.includes("Invalid login credentials")) {
                    msg = `<strong>❌ Identifiants incorrects ou compte non confirmé.</strong><br><br>• Vérifiez que le mot de passe est exact (sensible aux majuscules).<br>• Si vous avez oublié votre mot de passe, <a href='#' id='alert-link-forgot' style='color:var(--primary); font-weight:bold;'>cliquez ici pour le réinitialiser</a>.<br>• Si vous n'avez pas confirmé votre e-mail :<br><button type="button" onclick="resendConfirmation('${email}')" style="background:#4F46E5; color:white; border:none; padding:0.4rem 0.85rem; border-radius:6px; font-size:0.82rem; font-weight:bold; cursor:pointer; margin-top:0.5rem;"><i class="fa-solid fa-paper-plane"></i> Renvoyer l'e-mail de confirmation</button>`;
                } else if (msg.includes("Email not confirmed")) {
                    msg = `<strong>❌ Compte non confirmé.</strong><br>Veuillez consulter vos e-mails (et vos <strong>Spams</strong>) pour valider votre compte.<br><br><button type="button" onclick="resendConfirmation('${email}')" style="background:#4F46E5; color:white; border:none; padding:0.4rem 0.85rem; border-radius:6px; font-size:0.82rem; font-weight:bold; cursor:pointer; margin-top:0.4rem;"><i class="fa-solid fa-paper-plane"></i> Renvoyer l'e-mail de confirmation</button>`;
                } else if (msg.includes("User already registered") || msg.includes("already registered")) {
                    msg = "<strong>❌ Cet e-mail est déjà utilisé.</strong><br>Un compte existe déjà avec cette adresse. Veuillez vous connecter ou réinitialiser votre mot de passe.";
                }
                showAlert(msg, true);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        async function resendConfirmation(targetEmail) {
            if (!targetEmail) {
                targetEmail = document.getElementById('email').value.trim().toLowerCase();
            }
            if (!targetEmail) {
                showAlert("<strong>Veuillez saisir votre adresse e-mail.</strong>", true);
                return;
            }
            showAlert("<strong>⌛ Renvoi de l'e-mail de confirmation en cours...</strong>", false);
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || "index.html";
            const redirectUrl = window.location.origin + window.location.pathname + `?redirect=${encodeURIComponent(redirectTarget)}`;
            
            const { error } = await supabase.auth.resend({
                type: 'signup',
                email: targetEmail,
                options: {
                    emailRedirectTo: redirectUrl
                }
            });
            if (error) {
                showAlert(`<strong>❌ Erreur lors du renvoi :</strong> ${error.message}`, true);
            } else {
                showAlert(`<strong>✉️ Email de confirmation renvoyé avec succès !</strong><br>Un nouveau lien a été envoyé à <strong>${targetEmail}</strong>.<br><br>💡 N'oubliez pas d'inspecter vos <strong>Spams / Courriers indésirables</strong> !`, false);
            }
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('auth-form').addEventListener('submit', handleAuth);
            
            document.getElementById('toggle-password').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            document.getElementById('link-forgot').addEventListener('click', (e) => {
                e.preventDefault();
                setAuthMode('forgot');
            });

            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            if (urlParams.get('mode') === 'signup') {
                setAuthMode('signup');
            } else if (urlParams.get('mode') === 'forgot') {
                setAuthMode('forgot');
            } else if (urlParams.get('mode') === 'reset' || hashParams.get('type') === 'recovery') {
                setAuthMode('reset');
                showAlert("Veuillez saisir votre nouveau mot de passe ci-dessous.", false);
            } else {
                setAuthMode('login');
            }

            // Supabase auth state change listener (Auto-login after email confirmation click!)
            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session && currentMode !== 'reset') {
                    resetRateLimit();
                    showAlert("<strong>✅ Email vérifié avec succès !</strong><br>Connexion automatique à votre compte en cours...", false);
                    setTimeout(() => {
                        const redirectTarget = urlParams.get('redirect') || "index.html";
                        window.location.href = redirectTarget;
                    }, 1000);
                } else if (event === 'PASSWORD_RECOVERY') {
                    setAuthMode('reset');
                    showAlert("Veuillez saisir votre nouveau mot de passe ci-dessous.", false);
                }
            });

            // If user is already logged in (and not in reset mode), redirect to target page
            if (urlParams.get('mode') !== 'reset') {
                const { data } = await supabase.auth.getSession();
                if (data && data.session) {
                    const redirectTarget = urlParams.get('redirect') || "index.html";
                    window.location.href = redirectTarget;
                }
            }
        });
    </script>
</body>
</html>
