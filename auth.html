<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - NovaDoc</title>
    <link rel="stylesheet" href="styles.css?v=cvpro1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.auth-body {
            background: var(--body-bg);
            min-height: 100vh;
            margin: 0;
            padding: 3rem 1rem;
            color: var(--text-main);
            display: block;
            text-align: center;
        }
        .cvpro-login-card {
            background: var(--surface);
            padding: 2.2rem 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 460px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        .cvpro-login-card * {
            box-sizing: border-box;
        }
        
        /* Auth Tabs */
        .auth-tabs-nav {
            display: flex;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 1.5rem;
            gap: 4px;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .auth-tab-btn.active {
            background: var(--grad-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .cvpro-login-card h2 {
            margin-top: 0;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
            color: var(--text-main);
            display: block;
        }
        .cvpro-login-card p.subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
            display: block;
        }
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
            display: block;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            bottom: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .password-toggle:hover {
            color: var(--text-main);
        }
        .btn-auth {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: var(--transition);
        }
        .btn-auth:hover {
            box-shadow: var(--shadow-glow);
        }
        .toggle-text {
            display: block;
            margin-top: 1.4rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .toggle-text a, .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .toggle-text a:hover, .forgot-link:hover {
            text-decoration: underline;
        }
        .alert {
            display: none;
            padding: 0.85rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
            line-height: 1.45;
            text-align: left;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="dark-theme auth-body">

    <div class="cvpro-login-card">
        <a href="index.html" style="text-decoration: none; display: inline-block; margin-bottom: 0.8rem;">
            <i class="fa-solid fa-file-signature" style="color: var(--primary); font-size: 2.4rem;"></i>
        </a>
        
        <!-- Tab Switcher -->
        <div class="auth-tabs-nav" id="auth-tabs-container">
            <button class="auth-tab-btn active" id="tab-btn-login" onclick="window.switchTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Connexion
            </button>
            <button class="auth-tab-btn" id="tab-btn-signup" onclick="window.switchTab('signup')">
                <i class="fa-solid fa-user-plus"></i> Inscription
            </button>
        </div>

        <h2 id="auth-title">Connexion</h2>
        <p class="subtitle" id="auth-subtitle">Accédez à votre espace NovaDoc</p>
        
        <div id="auth-alert" class="alert"></div>

        <form id="auth-form">
            <div id="signup-fields" style="display: none;">
                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" class="form-control" placeholder="Votre prénom">
                </div>
                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" class="form-control" placeholder="Votre nom">
                </div>
            </div>
            
            <div class="form-group" id="email-group">
                <label for="email">Adresse E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required>
            </div>
            
            <div class="form-group" id="password-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label for="password" id="password-label" style="margin-bottom: 0;">Mot de passe</label>
                    <a href="#" id="link-forgot" class="forgot-link" style="font-size: 0.8rem;">Mot de passe oublié ?</a>
                </div>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye password-toggle" id="toggle-password"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-auth" id="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </button>
        </form>

        <p class="toggle-text" id="toggle-container">
            Pas encore de compte ? <a href="#" id="link-toggle">S'inscrire</a>
        </p>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://ahubfrxlycfkgriizmde.supabase.co';
        const SUPABASE_KEY = localStorage.getItem('supabase_anon_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodWJmcnhseWNma2dyaWl6bWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA5NTIsImV4cCI6MjA5OTcyNjk1Mn0.dCzbPw4wWgnYRU4XCH2B2WOgm1O3KaH6s2UCbsQ73bY';
        
        if (!localStorage.getItem('supabase_anon_key')) {
            localStorage.setItem('supabase_anon_key', SUPABASE_KEY);
        }

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Mode state: 'login' | 'signup' | 'forgot' | 'reset'
        let currentMode = 'login';

        window.switchTab = function(mode) {
            setAuthMode(mode);
        };

        function setAuthMode(mode) {
            currentMode = mode;
            hideAlert();
            updateUI();
        }

        function updateUI() {
            const titleEl = document.getElementById('auth-title');
            const subtitleEl = document.getElementById('auth-subtitle');
            const btnEl = document.getElementById('btn-submit');
            const toggleContainerEl = document.getElementById('toggle-container');
            const signupFields = document.getElementById('signup-fields');
            const emailGroup = document.getElementById('email-group');
            const passwordGroup = document.getElementById('password-group');
            const passwordLabel = document.getElementById('password-label');
            const linkForgot = document.getElementById('link-forgot');
            const tabLoginBtn = document.getElementById('tab-btn-login');
            const tabSignupBtn = document.getElementById('tab-btn-signup');
            const tabsNav = document.getElementById('auth-tabs-container');

            const prenomInput = document.getElementById('prenom');
            const nomInput = document.getElementById('nom');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            if (currentMode === 'signup') {
                tabsNav.style.display = 'flex';
                tabLoginBtn.classList.remove('active');
                tabSignupBtn.classList.add('active');

                titleEl.innerText = "Créer un compte";
                subtitleEl.innerText = "Rejoignez NovaDoc pour générer tous vos documents";
                btnEl.innerHTML = '<i class="fa-solid fa-user-plus"></i> S\'inscrire';
                toggleContainerEl.innerHTML = 'Déjà un compte ? <a href="#" id="link-toggle">Se connecter</a>';
                
                signupFields.style.display = 'block';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'none';
                passwordLabel.innerText = "Mot de passe";
                
                prenomInput.required = true;
                nomInput.required = true;
                emailInput.required = true;
                passwordInput.required = true;
            } else if (currentMode === 'forgot') {
                tabsNav.style.display = 'none';

                titleEl.innerText = "Mot de passe oublié";
                subtitleEl.innerText = "Saisissez votre adresse e-mail pour recevoir les instructions";
                btnEl.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoyer le lien';
                toggleContainerEl.innerHTML = 'Retour à la <a href="#" id="link-toggle">Connexion</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = true;
                passwordInput.required = false;
            } else if (currentMode === 'reset') {
                tabsNav.style.display = 'none';

                titleEl.innerText = "Nouveau mot de passe";
                subtitleEl.innerText = "Saisissez votre nouveau mot de passe ci-dessous";
                btnEl.innerHTML = '<i class="fa-solid fa-key"></i> Enregistrer le mot de passe';
                toggleContainerEl.innerHTML = '<a href="#" id="link-toggle">Retour à la connexion</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'none';
                passwordLabel.innerText = "Nouveau mot de passe";
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = false;
                passwordInput.required = true;
            } else {
                // Login mode
                tabsNav.style.display = 'flex';
                tabLoginBtn.classList.add('active');
                tabSignupBtn.classList.remove('active');

                titleEl.innerText = "Connexion";
                subtitleEl.innerText = "Accédez à votre espace NovaDoc";
                btnEl.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';
                toggleContainerEl.innerHTML = 'Pas encore de compte ? <a href="#" id="link-toggle">S\'inscrire</a>';
                
                signupFields.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                linkForgot.style.display = 'inline';
                passwordLabel.innerText = "Mot de passe";
                
                prenomInput.required = false;
                nomInput.required = false;
                emailInput.required = true;
                passwordInput.required = true;
            }

            // Attach event listener to dynamic link
            const toggleLink = document.getElementById('link-toggle');
            if (toggleLink) {
                toggleLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (currentMode === 'signup' || currentMode === 'forgot' || currentMode === 'reset') {
                        setAuthMode('login');
                    } else {
                        setAuthMode('signup');
                    }
                });
            }
        }

        function showAlert(msg, isError = true) {
            const alertEl = document.getElementById('auth-alert');
            alertEl.style.display = 'block';
            alertEl.innerHTML = msg;
            alertEl.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
            
            // Re-bind inner alert links if present
            const alertForgotLink = document.getElementById('alert-link-forgot');
            if (alertForgotLink) {
                alertForgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    setAuthMode('forgot');
                });
            }
        }

        function hideAlert() {
            document.getElementById('auth-alert').style.display = 'none';
        }

        async function handleAuth(e) {
            e.preventDefault();
            hideAlert();
            const btn = document.getElementById('btn-submit');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Traitement...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || "index.html";

            try {
                if (currentMode === 'signup') {
                    const prenom = document.getElementById('prenom').value.trim();
                    const nom = document.getElementById('nom').value.trim();

                    const redirectUrl = window.location.origin + window.location.pathname + `?redirect=${encodeURIComponent(redirectTarget)}`;

                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                first_name: prenom,
                                last_name: nom
                            },
                            emailRedirectTo: redirectUrl
                        }
                    });
                    if (error) throw error;
                    
                    // Check if user ALREADY EXISTS in Supabase (Identities array is empty)
                    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                        showAlert(`<strong>❌ E-mail déjà utilisé !</strong><br>Un compte NovaDoc existe déjà avec l'adresse <strong>${email}</strong>.<br><br>👉 Veuillez vous connecter avec cet e-mail ou cliquer sur <strong>Mot de passe oublié</strong>.`, true);
                        return;
                    }

                    if (data.session) {
                        // Instant session created
                        window.location.href = redirectTarget;
                    } else {
                        // Email confirmation is required by Supabase project settings
                        document.getElementById('auth-form').reset();
                        showAlert(`<strong>Inscription réussie ! ✉️</strong><br>Un e-mail de validation a été envoyé à <strong>${email}</strong>.<br><br>💡 <strong>REMARQUE IMPORTANTE :</strong> Veuillez ouvrir votre messagerie et vérifier attentivement votre dossier <strong>Spam / Courriers indésirables</strong>. Cliquez sur le lien pour valider votre compte.`, false);
                        setAuthMode('login');
                    }
                } else if (currentMode === 'forgot') {
                    const resetRedirectUrl = window.location.origin + window.location.pathname + '?mode=reset';
                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                        redirectTo: resetRedirectUrl
                    });
                    if (error) throw error;
                    showAlert(`<strong>Lien envoyé ! ✉️</strong><br>Un e-mail contenant les instructions a été envoyé à <strong>${email}</strong>.<br><br>Veuillez consulter votre boîte de réception (et vos spams) puis cliquer sur le lien pour créer votre nouveau mot de passe.`, false);
                } else if (currentMode === 'reset') {
                    const { error } = await supabase.auth.updateUser({ password: password });
                    if (error) throw error;
                    showAlert("<strong>Mot de passe mis à jour ! 🔑</strong><br>Votre mot de passe a été modifié avec succès. Redirection...", false);
                    setTimeout(() => {
                        window.location.href = redirectTarget;
                    }, 1500);
                } else {
                    // Login mode
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    if (error) throw error;
                    
                    window.location.href = redirectTarget;
                }
            } catch (err) {
                console.error("Auth error:", err);
                let msg = err.message || "Une erreur est survenue lors de l'authentification.";
                if (msg.includes("Invalid login credentials")) {
                    msg = "<strong>❌ Email ou mot de passe incorrect.</strong><br><br>• Si vous venez de vous inscrire, vérifiez que vous avez validé le lien reçu par e-mail (regardez vos <strong>spams</strong>).<br>• Si vous avez oublié votre mot de passe, <a href='#' id='alert-link-forgot' style='color:var(--primary); font-weight:bold;'>cliquez ici pour le réinitialiser</a>.";
                } else if (msg.includes("Email not confirmed")) {
                    msg = "<strong>❌ Compte non confirmé.</strong><br>Veuillez ouvrir vos e-mails (et spams) et cliquer sur le lien d'activation.";
                } else if (msg.includes("User already registered") || msg.includes("already registered")) {
                    msg = "<strong>❌ Cet e-mail est déjà utilisé.</strong><br>Un compte existe déjà avec cette adresse. Veuillez vous connecter ou réinitialiser votre mot de passe.";
                }
                showAlert(msg, true);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', async () => {
            // Attach form submission listener
            document.getElementById('auth-form').addEventListener('submit', handleAuth);
            
            // Password Visibility Toggle
            document.getElementById('toggle-password').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // Link "Mot de passe oublié"
            document.getElementById('link-forgot').addEventListener('click', (e) => {
                e.preventDefault();
                setAuthMode('forgot');
            });

            // Handle URL Parameters (mode & hash tokens)
            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            if (urlParams.get('mode') === 'signup') {
                setAuthMode('signup');
            } else if (urlParams.get('mode') === 'forgot') {
                setAuthMode('forgot');
            } else if (urlParams.get('mode') === 'reset' || hashParams.get('type') === 'recovery') {
                setAuthMode('reset');
                showAlert("Veuillez saisir votre nouveau mot de passe ci-dessous.", false);
            } else {
                setAuthMode('login');
            }

            // Supabase auth state change listener (e.g. for recovery links)
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') {
                    setAuthMode('reset');
                    showAlert("Veuillez saisir votre nouveau mot de passe ci-dessous.", false);
                }
            });

            // If user is already logged in (and not in reset mode), redirect to target page
            if (urlParams.get('mode') !== 'reset') {
                const { data } = await supabase.auth.getSession();
                if (data.session) {
                    const redirectTarget = urlParams.get('redirect') || "index.html";
                    window.location.href = redirectTarget;
                }
            }
        });
    </script>
</body>
</html>
