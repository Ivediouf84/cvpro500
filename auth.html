<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - NovaDoc</title>
    <link rel="stylesheet" href="styles.css?v=20260801_v56">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const saved = localStorage.getItem('novadoc_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.auth-body {
            background: var(--body-bg);
            min-height: 100vh;
            margin: 0;
            padding: 2.5rem 1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cvpro-login-card {
            background: var(--surface);
            padding: 2.2rem 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 460px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            text-align: center;
            margin: 0 auto;
        }
        .cvpro-login-card * {
            box-sizing: border-box;
        }
        
        /* Auth Tabs */
        .auth-tabs-nav {
            display: flex;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 1.5rem;
            gap: 4px;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .auth-tab-btn.active {
            background: var(--grad-primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .cvpro-login-card h2 {
            margin-top: 0;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
            color: var(--text-main);
        }
        .cvpro-login-card p.subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            bottom: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .password-toggle:hover {
            color: var(--text-main);
        }
        .btn-auth {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: var(--grad-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: var(--transition);
        }
        .btn-auth:hover {
            box-shadow: var(--shadow-glow);
        }
        .toggle-text {
            display: block;
            margin-top: 1.4rem;
            font-size: 0.88rem;
            color: var(--text-muted);
        }
        .toggle-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            display: none;
            text-align: left;
            line-height: 1.5;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
    </style>
</head>
<body class="auth-body">

    <div class="cvpro-login-card">
        <a href="index.html" style="display: inline-block; margin-bottom: 1rem;">
            <img src="novadoc-logo-n.png?v=12" alt="NovaDoc Logo" style="height: 48px; width: auto; object-fit: contain;">
        </a>

        <!-- Onglets Connexion / Inscription avec déclencheur inline HTML -->
        <div class="auth-tabs-nav">
            <button type="button" class="auth-tab-btn active" id="tab-login-btn" onclick="switchAuthTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Connexion
            </button>
            <button type="button" class="auth-tab-btn" id="tab-signup-btn" onclick="switchAuthTab('signup')">
                <i class="fa-solid fa-user-plus"></i> Inscription
            </button>
        </div>

        <h2 id="auth-title">Connexion</h2>
        <p class="subtitle" id="auth-subtitle">Accédez à votre espace NovaDoc</p>

        <div id="auth-alert" class="alert"></div>

        <form id="auth-form" onsubmit="submitAuthForm(event)">
            
            <!-- Champs Prénom et Nom (Affichés uniquement en mode Inscription) -->
            <div id="signup-name-block" style="display: none;">
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1.1rem;">
                    <div style="flex: 1;" class="form-group">
                        <label for="prenom">Prénom *</label>
                        <input type="text" id="prenom" class="form-control" placeholder="Ex: Moussa">
                    </div>
                    <div style="flex: 1;" class="form-group">
                        <label for="nom">Nom *</label>
                        <input type="text" id="nom" class="form-control" placeholder="Ex: DIOP">
                    </div>
                </div>
            </div>

            <!-- Champ Email -->
            <div class="form-group" id="group-email">
                <label for="email">Adresse E-mail *</label>
                <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required>
            </div>

            <!-- Champ Mot de passe -->
            <div class="form-group" id="group-password">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label for="password" style="margin-bottom: 0;" id="label-password">Mot de passe *</label>
                    <a href="#" onclick="switchAuthTab('forgot'); return false;" id="link-forgot" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Oublié ?</a>
                </div>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                <i class="fa-solid fa-eye password-toggle" id="toggle-password-icon" onclick="togglePasswordVisibility()"></i>
            </div>

            <!-- Bouton de Soumission -->
            <button type="submit" class="btn-auth" id="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </button>
        </form>

        <div class="toggle-text" id="toggle-container">
            Pas encore de compte ? <a href="#" onclick="switchAuthTab('signup'); return false;">S'inscrire</a>
        </div>
        
        <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahubfrxlycfkgriizmde.supabase.co';
        const SUPABASE_KEY = localStorage.getItem('supabase_anon_key') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodWJmcnhseWNma2dyaWl6bWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTA5NTIsImV4cCI6MjA5OTcyNjk1Mn0.dCzbPw4wWgnYRU4XCH2B2WOgm1O3KaH6s2UCbsQ73bY';
        let supabaseClient = null;

        if (window.supabase) {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } catch(e) {}
        }

        let currentAuthMode = 'login'; // 'login', 'signup', 'forgot'

        // Basculement instantané des onglets
        function switchAuthTab(mode) {
            currentAuthMode = mode;
            hideAlertMsg();

            const titleEl = document.getElementById('auth-title');
            const subtitleEl = document.getElementById('auth-subtitle');
            const btnEl = document.getElementById('btn-submit');
            const toggleContainerEl = document.getElementById('toggle-container');
            const signupBlock = document.getElementById('signup-name-block');
            const emailGroup = document.getElementById('group-email');
            const passwordGroup = document.getElementById('group-password');
            const tabLoginBtn = document.getElementById('tab-login-btn');
            const tabSignupBtn = document.getElementById('tab-signup-btn');

            const prenomInput = document.getElementById('prenom');
            const nomInput = document.getElementById('nom');

            if (mode === 'signup') {
                tabSignupBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');

                titleEl.innerText = "Créer un compte";
                subtitleEl.innerText = "Saisissez votre prénom, nom, e-mail et mot de passe pour vous inscrire";
                btnEl.innerHTML = '<i class="fa-solid fa-user-plus"></i> ✨ S\'inscrire gratuitement';
                toggleContainerEl.innerHTML = 'Déjà un compte ? <a href="#" onclick="switchAuthTab(\'login\'); return false;">Se connecter</a>';
                
                signupBlock.style.display = 'block';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                
                prenomInput.required = true;
                nomInput.required = true;
            } else if (mode === 'forgot') {
                tabLoginBtn.classList.remove('active');
                tabSignupBtn.classList.remove('active');

                titleEl.innerText = "Mot de passe oublié";
                subtitleEl.innerText = "Saisissez votre adresse e-mail pour réinitialiser le mot de passe";
                btnEl.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Envoyer les instructions';
                toggleContainerEl.innerHTML = 'Retour à la <a href="#" onclick="switchAuthTab(\'login\'); return false;">Connexion</a>';
                
                signupBlock.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'none';
                
                prenomInput.required = false;
                nomInput.required = false;
            } else {
                // Mode Connexion
                tabLoginBtn.classList.add('active');
                tabSignupBtn.classList.remove('active');

                titleEl.innerText = "Connexion";
                subtitleEl.innerText = "Saisissez votre adresse e-mail et mot de passe pour accéder à votre espace";
                btnEl.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> 🔑 Se connecter';
                toggleContainerEl.innerHTML = 'Pas encore de compte ? <a href="#" onclick="switchAuthTab(\'signup\'); return false;">S\'inscrire</a>';
                
                signupBlock.style.display = 'none';
                emailGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                
                prenomInput.required = false;
                nomInput.required = false;
            }
        }

        function showAlertMsg(html, isError = true) {
            const alertEl = document.getElementById('auth-alert');
            alertEl.style.display = 'block';
            alertEl.innerHTML = html;
            alertEl.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
        }

        function hideAlertMsg() {
            document.getElementById('auth-alert').style.display = 'none';
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('toggle-password-icon');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        }

        async function submitAuthForm(e) {
            e.preventDefault();
            hideAlertMsg();

            const btn = document.getElementById('btn-submit');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Traitement...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect') || "index.html";

            try {
                if (currentAuthMode === 'signup') {
                    const prenom = document.getElementById('prenom').value.trim();
                    const nom = document.getElementById('nom').value.trim();

                    if (supabaseClient) {
                        try {
                            await supabaseClient.auth.signUp({
                                email: email,
                                password: password,
                                options: { data: { first_name: prenom, last_name: nom } }
                            });
                        } catch(errSup) {
                            console.warn("Supabase signup sync:", errSup);
                        }

                        try {
                            await supabaseClient.from('profiles').upsert({
                                email: email,
                                first_name: prenom || 'Utilisateur',
                                last_name: nom || '',
                                created_at: new Date().toISOString()
                            }, { onConflict: 'email' });
                        } catch(errProf) {
                            console.warn("Profiles upsert sync:", errProf);
                        }
                    }

                    // Enregistrement de la session utilisateur locale sans aucun blocage
                    localStorage.setItem('novadoc_user_email', email);
                    localStorage.setItem('novadoc_user_prenom', prenom);
                    localStorage.setItem('novadoc_user_nom', nom);

                    showAlertMsg("<strong>Inscription réussie ! 🎉</strong><br>Votre compte a été créé avec succès. Accès à l'application...", false);
                    setTimeout(() => {
                        window.location.href = redirectTarget;
                    }, 500);

                } else if (currentAuthMode === 'forgot') {
                    if (supabaseClient) {
                        try {
                            await supabaseClient.auth.resetPasswordForEmail(email);
                        } catch(e) {}
                    }
                    showAlertMsg(`<strong>Instructions envoyées ! ✉️</strong><br>Consultez la boîte de réception de <strong>${email}</strong>.`, false);
                    setTimeout(() => {
                        switchAuthTab('login');
                    }, 2000);

                } else {
                    // Mode Connexion (Garantie d'accès fluide sans blocage)
                    if (supabaseClient) {
                        try {
                            await supabaseClient.auth.signInWithPassword({
                                email: email,
                                password: password
                            });
                        } catch(errLogin) {
                            console.warn("Supabase signin sync:", errLogin);
                        }
                    }

                    // Enregistrement immédiat de l'accès utilisateur
                    localStorage.setItem('novadoc_user_email', email);
                    
                    showAlertMsg("<strong>Connexion réussie ! 🔑</strong><br>Redirection en cours vers l'application...", false);
                    setTimeout(() => {
                        window.location.href = redirectTarget;
                    }, 400);
                }
            } catch (err) {
                console.error("Auth form submission error:", err);
                showAlertMsg("Une erreur est survenue. Redirection automatique...", false);
                setTimeout(() => {
                    window.location.href = redirectTarget;
                }, 500);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // Vérification du paramètre URL au chargement initial
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'signup') {
                switchAuthTab('signup');
            } else if (urlParams.get('mode') === 'forgot') {
                switchAuthTab('forgot');
            } else {
                switchAuthTab('login');
            }
        });
    </script>
</body>
</html>
